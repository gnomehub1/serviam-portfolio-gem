        // 2. Animated Code
        const AnimatedCode = () => {
            const codeLines = ['// Objective: Transform Colombian Education', '', 'class Serviam {', '  constructor() {', '    this.mission = "Impact through Art & Code";', '    this.tools = ["games", "art", "passion"];', '  }', '', '  createGame(subject) {', '    return new EducationalGame({', '      topic: subject,', '      philosophy: "Miyamoto",', '      audience: "Colombian Youth"', '    });', '  }', '', '  serve() {', '    while (this.hasPassion) {', '      this.teach();', '      this.create();', '      this.inspire();', '    }', '  }', '}'];
            const [lineCount, setLineCount] = useState(0);
            useEffect(() => {
                if (lineCount >= codeLines.length) return;
                const timer = setTimeout(() => setLineCount(prev => prev + 1), 120);
                return () => clearTimeout(timer);
            }, [lineCount]);
            const getLineColor = (line) => {
                if (line.startsWith('//')) return 'text-navy-700';
                if (line.includes('class ') || line.includes('constructor') || line.includes('return')) return 'text-ember-500';
                if (line.includes('this.')) return 'text-navy-700';
                if (line.includes('"') || line.includes("'")) return 'text-ember-400';
                if (line.includes('while') || line.includes('new ')) return 'text-ember-500';
                return 'text-white';
            };
            return (
                <div className="bg-navy-950 overflow-hidden border border-navy-800 scanlines">
                    <div className="flex items-center gap-2 px-4 py-2 bg-navy-900">
                        <div className="w-3 h-3 rounded-full bg-red-500"></div>
                        <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div className="w-3 h-3 rounded-full bg-green-500"></div>
                        <span className="ml-3 text-sm text-navy-700 font-mono">serviam.js</span>
                    </div>
                    <div className="p-4 font-mono text-sm overflow-hidden h-[350px]">
                        {codeLines.slice(0, lineCount).map((line, i) => (
                            <div key={i} className="flex">
                                <span className="w-8 text-navy-700 text-right mr-4 select-none">{i + 1}</span>
                                <span className={getLineColor(line)}>{line}</span>
                                {i === lineCount - 1 && lineCount < codeLines.length && <span className="animate-blink ml-1 text-ember-500">▌</span>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 3. Tech Terminal
        const TechTerminal = () => {
            const [activeCategory, setActiveCategory] = useState('frontend');
            return (
                <div className="w-full max-w-4xl mx-auto font-mono text-sm shadow-[0_0_20px_rgba(249,129,37,0.1)]">
                    <div className="bg-navy-800 border-t-2 border-l-2 border-r-2 border-navy-700 p-2 flex items-center justify-between rounded-t-lg">
                        <span className="text-white/60">C:\SKILLS\SYSTEM.EXE</span>
                        <div className="flex gap-2"><div className="w-3 h-3 bg-ember-500 rounded-full animate-pulse" /></div>
                    </div>
                    <div className="bg-navy-950 border-2 border-navy-700 p-6 min-h-[300px] relative overflow-hidden">
                        <div className="absolute inset-0 bg-ember-500/5 pointer-events-none scanlines" />
                        <div className="flex flex-wrap gap-4 mb-8 relative z-10">
                            {Object.keys(TECH_CATEGORIES).map((key) => (
                                <button key={key} onClick={() => setActiveCategory(key)} className={`px-4 py-2 border-2 transition-all duration-200 ${activeCategory === key ? 'border-ember-500 text-ember-500 bg-ember-500/10 shadow-[0_0_10px_rgba(249,129,37,0.3)]' : 'border-navy-700 text-white/40 hover:text-white hover:border-white/40'}`}>
                                    {TECH_CATEGORIES[key].title}
                                </button>
                            ))}
                        </div>
                        <div className="space-y-4 relative z-10">
                            <p className="text-ember-500 mb-4 animate-pulse">{TECH_CATEGORIES[activeCategory].desc}</p>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {TECH_CATEGORIES[activeCategory].items.map((item, idx) => (
                                    <div key={item} className="group relative p-2 border border-transparent hover:border-navy-700 hover:bg-navy-900/50" style={{ animationDelay: `${idx * 100}ms` }}>
                                        <span className="text-navy-700 mr-2">{'>'}</span>
                                        <span className="text-white group-hover:text-ember-400 transition-colors cursor-default">{item}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="mt-12 text-white/20">root@serviam:~$ <span className="animate-blink">_</span></div>
                    </div>
                </div>
            );
        };

        // 4. Gamified Timeline
        const GamifiedTimeline = () => {
            return (
                <div className="relative max-w-4xl mx-auto py-12">
                    <div className="absolute left-4 md:left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-navy-800 via-ember-500/50 to-navy-800 md:-ml-0.5"></div>
                    {EXPERIENCE_DATA.map((item, index) => (
                        <div key={index} className={`relative mb-16 flex flex-col md:flex-row items-center ${index % 2 === 0 ? 'md:flex-row-reverse' : ''}`}>
                            <div className="absolute left-4 md:left-1/2 w-10 h-10 rounded-full bg-navy-950 border-4 border-ember-500 z-10 -ml-5 md:-ml-5 flex items-center justify-center shadow-[0_0_15px_rgba(249,129,37,0.5)] group-hover:scale-110 transition-transform">
                                <div className="w-3 h-3 bg-white rounded-full" />
                            </div>
                            <div className="md:w-1/2" />
                            <div className={`md:w-1/2 pl-16 md:pl-0 ${index % 2 === 0 ? 'md:pr-16 md:text-right' : 'md:pl-16 md:text-left'}`}>
                                <div className="retro-card p-6 relative group hover:-translate-y-1 transition-transform border-l-4 border-ember-500">
                                    <span className={`absolute -top-3 ${index % 2 === 0 ? 'md:left-4' : 'right-4'} bg-navy-950 px-2 text-ember-500 font-mono text-xs border border-navy-700`}>{item.level}</span>
                                    <div className="text-white/40 font-mono text-xs mb-1">{item.year}</div>
                                    <h3 className="text-xl font-bold text-white mb-1 group-hover:text-ember-400 transition-colors">{item.title}</h3>
                                    <div className="text-sm text-navy-700 font-mono mb-2 uppercase tracking-wide">{item.org}</div>
                                    <p className="text-white/70 text-sm">{item.desc}</p>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 5. Holographic Card
        const HolographicCard = ({ children, className = '' }) => {
            const cardRef = useRef(null);
            const [rotation, setRotation] = useState({ x: 0, y: 0 });
            const [opacity, setOpacity] = useState(0);
            const handleMouseMove = (e) => {
                if (!cardRef.current) return;
                const rect = cardRef.current.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const rotateY = ((mouseX / width) - 0.5) * 20;
                const rotateX = ((mouseY / height) - 0.5) * -20;
                setRotation({ x: rotateX, y: rotateY });
                setOpacity(1);
            };
            const handleMouseLeave = () => { setRotation({ x: 0, y: 0 }); setOpacity(0); };
            return (
                <div ref={cardRef} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} className={`relative transition-transform duration-100 ease-out transform-style-3d cursor-pointer group ${className}`} style={{ transform: `perspective(1000px) rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)` }}>
                    <div className="relative z-10 h-full w-full">{children}</div>
                    <div className="absolute inset-0 pointer-events-none z-20 mix-blend-overlay rounded-lg" style={{ opacity: opacity, background: `linear-gradient(105deg, transparent 20%, rgba(249, 129, 37, 0.3) 40%, rgba(91, 132, 196, 0.3) 45%, rgba(255, 255, 255, 0.1) 50%, transparent 55%)`, transition: 'opacity 0.3s ease' }} />
                </div>
            );
        };

        // --- SECTIONS ---
        const FloatingPixels = () => {
            const pixels = useMemo(() => Array.from({ length: 20 }, (_, i) => ({ id: i, size: Math.random() * 8 + 4, left: Math.random() * 100, top: Math.random() * 100, delay: Math.random() * 5, duration: Math.random() * 10 + 10, color: Math.random() > 0.5 ? '#F98125' : '#5B84C4' })), []);
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    {pixels.map(pixel => (
                        <div key={pixel.id} className="absolute animate-float opacity-20" style={{ width: pixel.size, height: pixel.size, left: `${pixel.left}%`, top: `${pixel.top}%`, backgroundColor: pixel.color, animationDelay: `${pixel.delay}s`, animationDuration: `${pixel.duration}s` }} />
                    ))}
                </div>
            );
        };

        const Navigation = () => {
            const { lang, setLang, t } = useLanguage();
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'bg-navy-950/95 backdrop-blur-sm py-3 shadow-lg border-b border-navy-800' : 'py-6'}`}>
                    <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
                        <a href="#" className="font-mono text-ember-500 text-xl tracking-wider glow-ember">{'<'}SERVIAM{'>'}</a>
                        <div className="hidden md:flex items-center gap-8">
                            <a href="#about" className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t('nav.about')}</a>
                            <a href="#stack" className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t('nav.stack')}</a>
                            <a href="#experience" className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t('nav.exp')}</a>
                            <a href="#rugs" className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t('nav.rugs')}</a>
                            <a href="#contact" className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t('nav.contact')}</a>
                        </div>
                        <div className="hidden md:flex items-center gap-2 bg-navy-900 p-1 rounded border border-navy-800">
                            <button onClick={() => setLang('en')} className={`px-3 py-1 text-xs font-mono transition-all ${lang === 'en' ? 'bg-ember-500 text-white' : 'text-white/60 hover:text-white'}`}>EN</button>
                            <button onClick={() => setLang('es')} className={`px-3 py-1 text-xs font-mono transition-all ${lang === 'es' ? 'bg-ember-500 text-white' : 'text-white/60 hover:text-white'}`}>ES</button>
                        </div>
                    </div>
                </nav>
            );
        };

        const HeroSection = () => {
            const { t } = useLanguage();
            return (
                <section className="min-h-screen flex items-center justify-center relative pt-20 px-6">
                    <div className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-12 items-center">
                        <div className="space-y-8 flex flex-col items-center lg:items-start">
                            <ServiamLogo />
                            <p className="font-mono text-ember-400 text-lg tracking-widest text-center lg:text-left">{t('hero.subtitle')}</p>
                            <h1 className="text-2xl md:text-3xl lg:text-4xl font-bold leading-tight text-center lg:text-left">
                                <span className="text-white">{t('hero.tagline').split('&')[0]}</span>
                                <span className="text-ember-500">&</span>
                                <span className="text-white">{t('hero.tagline').split('&')[1]}</span>
                            </h1>
                            <p className="text-lg text-white/70 leading-relaxed max-w-xl text-center lg:text-left">{t('hero.description')}</p>
                            <div className="flex flex-wrap gap-4 justify-center lg:justify-start">
                                <a href="#contact" className="pixel-btn">{t('hero.cta')}</a>
                                <a href="#experience" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 transition-colors font-mono">{'> '}{t('nav.exp')}</a>
                            </div>
                        </div>
                        <div className="hidden lg:block"><AnimatedCode /></div>
                    </div>
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-center">
                        <p className="text-navy-700 text-sm mb-2 font-mono animate-pulse">{t('hero.scroll')}</p>
                        <div className="w-6 h-10 border-2 border-navy-700 rounded-full mx-auto flex justify-center">
                            <div className="w-1.5 h-3 bg-ember-500 rounded-full mt-2 animate-bounce"></div>
                        </div>
                    </div>
                </section>
            );
        };

        const AboutSection = () => {
            const { t } = useLanguage();
            return (
                <section id="about" className="py-24 px-6 relative">
                    <div className="max-w-6xl mx-auto">
                        <div className="grid lg:grid-cols-2 gap-16 items-center">
                            <div className="space-y-6">
                                <h2 className="text-4xl font-bold"><span className="text-ember-500">{'{'}</span>{t('nav.about')}<span className="text-ember-500">{'}'}</span></h2>
                                <p className="text-2xl text-ember-400 font-mono">I'm William, an artist who fell in love with code.</p>
                                <p className="text-white/70 leading-relaxed">With a background in Audiovisual Arts and Fine Arts, I discovered that the most powerful canvas is the one that responds to your commands. My mission is to transform how Colombian youth learn technology—through the universal language of play.</p>
                                <p className="text-white/70 leading-relaxed">I believe every child deserves access to the skills that will shape their future. That's why I create educational games that teach Python, HTML, CSS, JavaScript, and even quantum physics concepts—making complex ideas feel like magic.</p>
                            </div>
                            <div className="relative">
                                <div className="absolute -inset-4 bg-gradient-to-r from-ember-500/20 to-navy-700/20 blur-xl rounded-full" />
                                <img src="lennon.jpg" alt="About" className="relative rounded-lg border-2 border-navy-700 shadow-2xl grayscale hover:grayscale-0 transition-all duration-500" />
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const StackSection = () => {
            const { t } = useLanguage();
            return (
                <section id="stack" className="py-24 px-6 bg-navy-900/30">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">~/</span> {t('nav.stack')}</h2>
                        </div>
                        <TechTerminal />
                    </div>
                </section>
            );
        };

        const ExperienceSection = () => {
            const { t } = useLanguage();
            return (
                <section id="experience" className="py-24 px-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">{'['}</span> Level Select <span className="text-ember-500">{']'}</span></h2>
                        </div>
                        <GamifiedTimeline />
                    </div>
                </section>
            );
        };

        const GallerySection = () => {
            const { t } = useLanguage();
            return (
                <section id="rugs" className="py-24 px-6 bg-navy-900/30">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">~</span> {t('nav.rugs')} <span className="text-ember-500">~</span></h2>
                            <p className="text-white/60">Hover to inspect the artifact</p>
                        </div>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {RUG_GALLERY.map((rug) => (
                                <HolographicCard key={rug.id} className="aspect-[4/5]">
                                    <div className="h-full w-full bg-navy-800 border-2 border-navy-700 overflow-hidden relative group">
                                        <img src={rug.src} alt={rug.title} className="w-full h-full object-cover" />
                                        <div className="absolute bottom-0 left-0 right-0 bg-navy-950/90 p-4 transform translate-y-full group-hover:translate-y-0 transition-transform duration-300 border-t-2 border-ember-500">
                                            <h3 className="text-ember-500 font-bold font-mono">{rug.title}</h3>
                                            <p className="text-white/70 text-xs">{rug.desc}</p>
                                        </div>
                                    </div>
                                </HolographicCard>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ContactSection = () => {
            const { t } = useLanguage();
            return (
                <section id="contact" className="py-24 px-6">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">/*</span> {t('common.contact')} <span className="text-ember-500">*/</span></h2>
                        </div>
                        <div className="retro-card p-8 text-center">
                            <p className="text-white/70 mb-8">Ready to start a new game? Let's build something legendary.</p>
                            <div className="flex flex-wrap justify-center gap-6">
                                <a href="mailto:wsandoval2@unab.edu.co" className="pixel-btn text-sm">wsandoval2@unab.edu.co</a>
                                <a href="https://linkedin.com" target="_blank" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 hover:text-ember-500 transition-colors font-mono">LinkedIn</a>
                                <a href="https://github.com" target="_blank" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 hover:text-ember-500 transition-colors font-mono">GitHub</a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            const { t } = useLanguage();
            return (
                <footer className="py-12 px-6 border-t border-navy-800 bg-navy-950">
                    <div className="max-w-6xl mx-auto text-center">
                        <p className="text-2xl font-mono text-ember-500 glow-ember mb-4">{t('footer.motto')}</p>
                        <p className="text-white/40 text-sm">© {new Date().getFullYear()} Serviam. {t('footer.rights')}.</p>
                        <div className="mt-6 text-xs text-navy-700 font-mono">{'<'}Built with ❤️ and {'<'}code/{'>'}{'/'}{'>'}</div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('en');
            const t = (key) => translations[lang][key] || key;
            return (
                <LanguageContext.Provider value={{ lang, setLang, t }}>
                    <div className="relative min-h-screen">
                        <FloatingPixels />
                        <Navigation />
                        <main>
                            <HeroSection />
                            <AboutSection />
                            <StackSection />
                            <ExperienceSection />
                            <GallerySection />
                            <ContactSection />
                        </main>
                        <Footer />
                    </div>
                </LanguageContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
