<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVIAM | Art + Code = Impact</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@300;400;500;600;700&family=VT323&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                extend: {
                    colors: {
                        navy: { 950: "#11224D", 900: "#193A6F", 800: "#2C599D", 700: "#5B84C4" },
                        ember: { 500: "#F98125", 400: "#FB9B50" },
                    },
                    fontFamily: {
                        mono: ['"Press Start 2P"', 'monospace'],
                        pixel: ['"VT323"', 'monospace'],
                        body: ['"Space Grotesk"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'blink': 'blink 1s step-end infinite',
                        'scanline': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        blink: {
                            '0%, 50%': { opacity: '1' },
                            '51%, 100%': { opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* SMOOTH SCROLLING */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #11224D;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #11224D; }
        ::-webkit-scrollbar-thumb { background: #F98125; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FB9B50; }

        /* Utilities */
        .glow-ember { 
            text-shadow: 0 0 10px rgba(249,129,37,0.5), 
                         0 0 20px rgba(249,129,37,0.3); 
        }
        
        .scanlines { position: relative; overflow: hidden; }
        .scanlines::after {
            content: ""; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
            pointer-events: none;
            z-index: 10;
        }

        .pixel-btn {
            position: relative; 
            padding: 0.75rem 1.5rem; 
            color: white; 
            text-transform: uppercase;
            letter-spacing: 0.05em; 
            font-family: 'VT323', monospace; 
            font-size: 1.5rem;
            background: #F98125; 
            box-shadow: 4px 4px 0 #193A6F; 
            transition: all 0.1s ease;
            display: inline-block; 
            cursor: pointer;
            border: 2px solid #FB9B50;
        }
        .pixel-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #193A6F; }
        .pixel-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #193A6F; }

        .retro-card {
            background-color: #193A6F; 
            border: 2px solid #2C599D;
            box-shadow: 8px 8px 0 rgba(249,129,37,0.2); 
            transition: all 0.2s ease;
        }
        .retro-card:hover {
            border-color: #F98125; 
            box-shadow: 12px 12px 0 rgba(249,129,37,0.3);
            transform: translate(-2px, -2px);
        }

        .transform-style-3d { transform-style: preserve-3d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef, useMemo } = React;

        // --- DATA ---

        const RUG_GALLERY = [
            { id: 'mario', src: 'mario.jpg', title: 'Super Mario World', desc: 'Tufted 8-bit classic' },
            { id: 'daft', src: 'daftpunk.jpg', title: 'Discovery Era', desc: 'Digital Funk in Wool' },
            { id: 'lennon', src: 'lennon.jpg', title: 'Imagine', desc: 'Pop Art Portraiture' },
            { id: 'adventure', src: 'adventure.jpg', title: 'Land of Ooo', desc: 'Mathematical!' },
            { id: 'cat-blue', src: 'bluecat.jpg', title: 'Neon Feline', desc: 'Synthwave Aesthetics' },
            { id: 'frog', src: 'frog.jpg', title: 'Psychedelic Toad', desc: 'Vibrant Textures' },
            { id: 'cat-sunset', src: 'sunsetcat.jpg', title: 'Sunset Serenity', desc: 'Retrowave Vibes' },
            { id: 'wallace', src: 'wallace.jpg', title: 'Freedom Cry', desc: 'Braveheart in Technicolor' },
            { id: 'hendrix', src: 'hendrix.jpg', title: 'Voodoo Child', desc: 'Psychedelic Rock Legend' },
        ];

        const EXPERIENCE_DATA = [
            { year: '2011-2017', level: 'LEVEL 1', title: 'Maestro en Artes Audiovisuales', org: 'UNAB', desc_en: 'Cinema & Television studies with a specialization in 2D Digital Animation.', desc_es: 'Estudios de Cine y TV con especialización en Animación Digital 2D.' },
            { year: '2018-2020', level: 'LEVEL 2', title: 'Artista Plástico', org: 'UIS', desc_en: 'Fine arts enhancement: Sculpting, Painting, Color Theory, and Concept Art.', desc_es: 'Artes plásticas: Escultura, Pintura, Teoría del Color y Concept Art.' },
            { year: '2020-2023', level: 'LEVEL 3', title: 'Textile Artist & Founder', org: 'billythekid.co', desc_en: 'Deep dive into textile art: Cross-Stitch, Embroidery, MagicNeedle, and Tufting.', desc_es: 'Inmersión en arte textil: Punto de Cruz, Bordado, Aguja Mágica y Tufting.' },
            { year: '2023-2024', level: 'LEVEL 4', title: 'AI Trainer', org: 'Outlier AI', desc_en: 'Trained LLMs (Gemini, ChatGPT) in Spanish fluency, grammar, and creative writing.', desc_es: 'Entrenamiento de LLMs (Gemini, ChatGPT) en fluidez, gramática y escritura creativa.' },
            { year: '2024-Present', level: 'LEVEL 5', title: 'Queue Manager', org: 'Scale AI', desc_en: 'Overseeing execution of AI projects across LATAM, managing cross-functional bilingual teams.', desc_es: 'Supervisión de proyectos de IA en LATAM, gestionando equipos bilingües multifuncionales.' },
            { year: '2025', level: 'BOSS STAGE', title: 'Founder', org: 'SERVIAM', desc_en: 'Educational project teaching Colombian youth Tech & AI through the medium of Art.', desc_es: 'Proyecto educativo enseñando Tech & AI a jóvenes colombianos a través del Arte.' },
        ];

        const TECH_CATEGORIES = {
            frontend: { title: 'FRONTEND_DEV', items: ['HTML5', 'CSS3', 'JavaScript', 'React.js', 'TailwindCSS'], desc: '> Loading UI Matrix... [RENDERED]' },
            gameArt: { title: 'GAME_&_ART', items: ['Construct 3', 'Aseprite', 'Moho Animation', 'Photoshop'], desc: '> Initializing Asset Pipeline... [COMPLETE]' },
            backend: { title: 'LOGIC_CORE', items: ['Python', 'JavaScript', 'Firebase', 'Prompt Eng.'], desc: '> Connecting to Server... [ESTABLISHED]' }
        };

        const translations = {
            en: {
                'nav.about': 'About', 'nav.stack': 'Stack', 'nav.exp': 'XP', 'nav.rugs': 'Gallery', 'nav.contact': 'Contact',
                'hero.subtitle': 'Art + Code = Impact', 'hero.tagline': 'Educational Technology Developer & Visual Artist',
                'hero.description': "I build games that teach kids to code. I create art that bridges the digital and physical worlds. I believe technology education is the key to Colombia's future.",
                'hero.cta': "Let's Connect", 'hero.scroll': 'Insert Coin to Start', 
                'about.title': 'About Me',
                'about.intro': "I'm William, an artist who fell in love with code.",
                'about.p1': "With a background in Audiovisual Arts and Fine Arts, I discovered that the most powerful canvas is the one that responds to your commands. My mission is to transform how Colombian youth learn technology—through the universal language of play.",
                'about.p2': "I believe every child deserves access to the skills that will shape their future. That's why I create educational games that teach Python, HTML, CSS, JavaScript, and even quantum physics concepts—making complex ideas feel like magic.",
                'stack.title': 'Stack',
                'exp.title': 'Level Select',
                'gallery.title': 'Gallery', 'gallery.sub': 'Click to inspect the artifact',
                'contact.title': 'Contact Me', 'contact.text': "Ready to start a new game? Let's build something legendary.",
                'footer.motto': '"Serviam" — I will serve', 'footer.rights': 'All rights reserved',
            },
            es: {
                'nav.about': 'Sobre Mí', 'nav.stack': 'Tecnología', 'nav.exp': 'XP', 'nav.rugs': 'Galería', 'nav.contact': 'Contacto',
                'hero.subtitle': 'Arte + Código = Impacto', 'hero.tagline': 'Desarrollador de Tecnología Educativa & Artista Visual',
                'hero.description': 'Creo juegos que enseñan a los niños a programar. Creo arte que une los mundos digital y físico. Creo que la educación tecnológica es la clave del futuro de Colombia.',
                'hero.cta': 'Conectemos', 'hero.scroll': 'Inserta Moneda',
                'about.title': 'Sobre Mí',
                'about.intro': "Soy William, un artista que se enamoró del código.",
                'about.p1': "Con experiencia en Artes Audiovisuales y Plásticas, descubrí que el lienzo más poderoso es el que responde a tus comandos. Mi misión es transformar cómo la juventud colombiana aprende tecnología—a través del lenguaje universal del juego.",
                'about.p2': "Creo que cada niño merece acceso a las habilidades que formarán su futuro. Por eso creo juegos educativos que enseñan Python, HTML, CSS, JavaScript, e incluso conceptos de física cuántica—haciendo que ideas complejas parezcan magia.",
                'stack.title': 'Stack', 
                'exp.title': 'Selección de Nivel',
                'gallery.title': 'Galería', 'gallery.sub': 'Click para inspeccionar el artefacto',
                'contact.title': 'Contáctame', 'contact.text': "¿Listo para iniciar un nuevo juego? Construyamos algo legendario.",
                'footer.motto': '"Serviam" — Serviré', 'footer.rights': 'Todos los derechos reservados',
            }
        };

        const LanguageContext = createContext(null);
        const useLanguage = () => useContext(LanguageContext);

        // --- COMPONENTS ---

        const ServiamLogo = () => {
            return (
                <div className="flex flex-col items-center select-none group">
                    <div className="absolute w-80 h-80 opacity-30 group-hover:opacity-50 transition-opacity duration-700 pointer-events-none" style={{ background: 'radial-gradient(circle, rgba(249,129,37,0.4) 0%, rgba(249,129,37,0.1) 40%, transparent 70%)', filter: 'blur(40px)' }} />
                    <div className="relative animate-float" style={{ animationDuration: '4s' }}>
                        {/* UPDATED LOGO FILTERS:
                           - Brightness boosted to 1.3 (130%) for light emission.
                           - Hue-rotate set to 5deg (Golden/Yellow-Orange) instead of 349deg (Red).
                           - Saturate increased to 500% to hold color against the brightness.
                           - Drop-shadow color changed to #FFB050 (Lighter Orange/Gold) for the glow.
                        */}
                        <img 
                            src="Logo.png" 
                            alt="SERVIAM" 
                            className="w-56 sm:w-72 md:w-80 lg:w-96 h-auto"
                            style={{ 
                                filter: `invert(1) sepia(1) saturate(5) hue-rotate(346deg) brightness(1.1) drop-shadow(0 0 8px rgba(249,129,37,0.8)) drop-shadow(0 0 20px rgba(249,129,37,0.5)) drop-shadow(0 0 40px rgba(249,129,37,0.3))`
                            }} 
                        />
                    </div>
                </div>
            );
        };

        const Lightbox = ({ src, title, onClose }) => {
            if (!src) return null;
            return (
                <div className="fixed inset-0 z-[60] bg-navy-950/95 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer" onClick={onClose}>
                    <div className="relative max-w-4xl w-full animate-float">
                        <button className="absolute -top-12 right-0 text-white hover:text-ember-500 font-mono text-xl">
                            [CLOSE X]
                        </button>
                        <img src={src} alt={title} className="w-full h-auto rounded border-2 border-ember-500 shadow-[0_0_30px_rgba(249,129,37,0.3)]" onClick={(e) => e.stopPropagation()} />
                        <div className="mt-4 text-center">
                            <h3 className="text-2xl font-mono text-ember-500">{title}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const AnimatedCode = () => {
            const codeLines = ['// Objective: Transform Colombian Education', '', 'class Serviam {', '  constructor() {', '    this.mission = "Impact through Art & Code";', '    this.tools = ["games", "art", "passion"];', '  }', '', '  createGame(subject) {', '    return new EducationalGame({', '      topic: subject,', '      philosophy: "Miyamoto",', '      audience: "Colombian Youth"', '    });', '  }', '', '  serve() {', '    while (this.hasPassion) {', '      this.teach();', '      this.create();', '      this.inspire();', '    }', '  }', '}'];
            const [lineCount, setLineCount] = useState(0);
            useEffect(() => {
                if (lineCount >= codeLines.length) return;
                const timer = setTimeout(() => setLineCount(prev => prev + 1), 120);
                return () => clearTimeout(timer);
            }, [lineCount]);
            const getLineColor = (line) => {
                if (line.startsWith('//')) return 'text-navy-700';
                if (line.includes('class ') || line.includes('constructor') || line.includes('return')) return 'text-ember-500';
                if (line.includes('this.')) return 'text-navy-700';
                if (line.includes('"') || line.includes("'")) return 'text-ember-400';
                if (line.includes('while') || line.includes('new ')) return 'text-ember-500';
                return 'text-white';
            };
            return (
                <div className="bg-navy-950 overflow-hidden border border-navy-800 scanlines">
                    <div className="flex items-center gap-2 px-4 py-2 bg-navy-900">
                        <div className="w-3 h-3 rounded-full bg-red-500"></div>
                        <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div className="w-3 h-3 rounded-full bg-green-500"></div>
                        <span className="ml-3 text-sm text-navy-700 font-mono">serviam.js</span>
                    </div>
                    <div className="p-4 font-mono text-sm overflow-hidden h-[350px]">
                        {codeLines.slice(0, lineCount).map((line, i) => (
                            <div key={i} className="flex">
                                <span className="w-8 text-navy-700 text-right mr-4 select-none">{i + 1}</span>
                                <span className={getLineColor(line)}>{line}</span>
                                {i === lineCount - 1 && lineCount < codeLines.length && <span className="animate-blink ml-1 text-ember-500">▌</span>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TechTerminal = () => {
            const [activeCategory, setActiveCategory] = useState('frontend');
            return (
                <div className="w-full max-w-4xl mx-auto font-mono text-sm shadow-[0_0_20px_rgba(249,129,37,0.1)]">
                    <div className="bg-navy-800 border-t-2 border-l-2 border-r-2 border-navy-700 p-2 flex items-center justify-between rounded-t-lg">
                        <span className="text-white/60">C:\SKILLS\SYSTEM.EXE</span>
                        <div className="w-3 h-3 bg-ember-500 rounded-full animate-pulse" />
                    </div>
                    <div className="bg-navy-950 border-2 border-navy-700 p-6 min-h-[300px] relative overflow-hidden">
                        <div className="absolute inset-0 bg-ember-500/5 pointer-events-none scanlines" />
                        <div className="flex flex-wrap gap-4 mb-8 relative z-10">
                            {Object.keys(TECH_CATEGORIES).map((key) => (
                                <button key={key} onClick={() => setActiveCategory(key)} className={`px-4 py-2 border-2 transition-all duration-200 ${activeCategory === key ? 'border-ember-500 text-ember-500 bg-ember-500/10' : 'border-navy-700 text-white/40 hover:text-white'}`}>
                                    {TECH_CATEGORIES[key].title}
                                </button>
                            ))}
                        </div>
                        <div className="space-y-4 relative z-10">
                            <p className="text-ember-500 mb-4 animate-pulse">{TECH_CATEGORIES[activeCategory].desc}</p>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {TECH_CATEGORIES[activeCategory].items.map((item, idx) => (
                                    <div key={item} className="p-2 border border-transparent hover:border-navy-700 hover:bg-navy-900/50">
                                        <span className="text-navy-700 mr-2">{'>'}</span>
                                        <span className="text-white">{item}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const GamifiedTimeline = () => {
            const { lang } = useLanguage();
            return (
                <div className="relative max-w-4xl mx-auto py-12">
                    <div className="absolute left-4 md:left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-navy-800 via-ember-500/50 to-navy-800 md:-ml-0.5"></div>
                    {EXPERIENCE_DATA.map((item, index) => (
                        <div key={index} className={`relative mb-16 flex flex-col md:flex-row items-center ${index % 2 === 0 ? 'md:flex-row-reverse' : ''}`}>
                            <div className="absolute left-4 md:left-1/2 w-10 h-10 rounded-full bg-navy-950 border-4 border-ember-500 z-10 -ml-5 md:-ml-5 flex items-center justify-center shadow-[0_0_15px_rgba(249,129,37,0.5)]">
                                <div className="w-3 h-3 bg-white rounded-full" />
                            </div>
                            <div className="md:w-1/2" />
                            <div className={`md:w-1/2 pl-16 md:pl-0 ${index % 2 === 0 ? 'md:pr-16 md:text-right' : 'md:pl-16 md:text-left'}`}>
                                <div className="retro-card p-6 relative group hover:-translate-y-1 transition-transform border-l-4 border-ember-500">
                                    <span className={`absolute -top-3 ${index % 2 === 0 ? 'md:left-4' : 'right-4'} bg-navy-950 px-2 text-ember-500 font-mono text-xs border border-navy-700`}>{item.level}</span>
                                    <div className="text-white/40 font-mono text-xs mb-1">{item.year}</div>
                                    <h3 className="text-xl font-bold text-white mb-1 group-hover:text-ember-400 transition-colors">{item.title}</h3>
                                    <div className="text-sm text-navy-700 font-mono mb-2 uppercase tracking-wide">{item.org}</div>
                                    <p className="text-white/70 text-sm">{lang === 'es' && item.desc_es ? item.desc_es : item.desc_en}</p>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const HolographicCard = ({ children, onClick, className = '' }) => {
            const cardRef = useRef(null);
            const [rotation, setRotation] = useState({ x: 0, y: 0 });
            const [opacity, setOpacity] = useState(0);

            const handleMouseMove = (e) => {
                if (!cardRef.current) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateY = ((x - centerX) / centerX) * 8; 
                const rotateX = ((y - centerY) / centerY) * -8;
                setRotation({ x: rotateX, y: rotateY });
                setOpacity(1);
            };

            const handleMouseLeave = () => {
                setRotation({ x: 0, y: 0 });
                setOpacity(0);
            };

            return (
                <div 
                    ref={cardRef} 
                    onClick={onClick} 
                    onMouseMove={handleMouseMove} 
                    onMouseLeave={handleMouseLeave} 
                    className={`relative cursor-pointer group ${className}`} 
                    style={{ perspective: '1000px', transformStyle: 'preserve-3d' }}
                >
                    <div 
                        className="relative z-10 h-full w-full transition-transform duration-300 ease-out"
                        style={{ transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)` }}
                    >
                        {children}
                        <div className="absolute inset-0 pointer-events-none z-20 mix-blend-overlay rounded-lg transition-opacity duration-300" 
                             style={{ opacity: opacity, background: `linear-gradient(105deg, transparent 20%, rgba(249, 129, 37, 0.3) 40%, rgba(255, 255, 255, 0.1) 50%, transparent 55%)` }} />
                    </div>
                </div>
            );
        };

        // --- SECTIONS ---
        const Navigation = () => {
            const { lang, setLang, t } = useLanguage();
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'bg-navy-950/95 backdrop-blur-sm py-3 shadow-lg border-b border-navy-800' : 'py-6'}`}>
                    <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
                        <a href="#" className="font-mono text-ember-500 text-xl tracking-wider glow-ember">{'<'}SERVIAM{'>'}</a>
                        <div className="hidden md:flex items-center gap-8">
                            {['about', 'stack', 'experience', 'rugs', 'contact'].map(item => (
                                <a key={item} href={`#${item}`} className="text-white/80 hover:text-ember-500 transition-colors font-mono text-sm">{t(`nav.${item === 'experience' ? 'exp' : item}`)}</a>
                            ))}
                        </div>
                        <div className="flex items-center gap-2 bg-navy-900 p-1 rounded border border-navy-800">
                            <button onClick={() => setLang('en')} className={`px-3 py-1 text-xs font-mono transition-all ${lang === 'en' ? 'bg-ember-500 text-white' : 'text-white/60 hover:text-white'}`}>EN</button>
                            <button onClick={() => setLang('es')} className={`px-3 py-1 text-xs font-mono transition-all ${lang === 'es' ? 'bg-ember-500 text-white' : 'text-white/60 hover:text-white'}`}>ES</button>
                        </div>
                    </div>
                </nav>
            );
        };

        const HeroSection = () => {
            const { t } = useLanguage();
            return (
                <section className="min-h-screen flex items-center justify-center relative pt-20 px-6">
                    <div className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-12 items-center relative z-10">
                        <div className="space-y-8 flex flex-col items-center lg:items-start text-center lg:text-left">
                            <ServiamLogo />
                            <p className="font-mono text-ember-400 text-lg tracking-widest">{t('hero.subtitle')}</p>
                            <h1 className="text-3xl lg:text-4xl font-bold leading-tight">
                                <span className="text-white">{t('hero.tagline').split('&')[0]}</span>
                                <span className="text-ember-500">&</span>
                                <span className="text-white">{t('hero.tagline').split('&')[1]}</span>
                            </h1>
                            <p className="text-lg text-white/70 leading-relaxed max-w-xl">{t('hero.description')}</p>
                            <div className="flex flex-wrap gap-4 justify-center lg:justify-start">
                                <a href="#contact" className="pixel-btn">{t('hero.cta')}</a>
                                <a href="#experience" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 transition-colors font-mono">{'> '}{t('nav.exp')}</a>
                            </div>
                        </div>
                        <div className="hidden lg:block w-full"><AnimatedCode /></div>
                    </div>
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-center z-10">
                        <p className="text-navy-700 text-sm mb-2 font-mono animate-pulse">{t('hero.scroll')}</p>
                        <div className="w-6 h-10 border-2 border-navy-700 rounded-full mx-auto flex justify-center"><div className="w-1.5 h-3 bg-ember-500 rounded-full mt-2 animate-bounce"></div></div>
                    </div>
                </section>
            );
        };

        const AboutSection = () => {
    const { t } = useLanguage();
    
    return (
        <section id="about" className="py-24 px-6 relative">
            <div className="max-w-6xl mx-auto">
                <div className="grid lg:grid-cols-2 gap-16 items-center">
                    <div className="space-y-6">
                        <h2 className="text-4xl font-bold">
                            <span className="text-ember-500">{'{'}</span>
                            {t('nav.about')}
                            <span className="text-ember-500">{'}'}</span>
                        </h2>
                        
                        {/* Replaced hardcoded text with translation keys */}
                        <p className="text-2xl text-ember-400 font-mono">
                            {t('about.intro')}
                        </p>
                        <p className="text-white/70 leading-relaxed">
                            {t('about.p1')}
                        </p>
                        <p className="text-white/70 leading-relaxed">
                            {t('about.p2')}
                        </p>
                    </div>
                    
                    <div className="relative">
                        <div className="absolute -inset-4 bg-gradient-to-r from-ember-500/20 to-navy-700/20 blur-xl rounded-full" />
                        {/* Added scale-120 here for the 20% increase you wanted */}
                        <img 
                            src="lennon.jpg" 
                            alt="About" 
                            className="relative rounded-lg border-2 border-navy-700 shadow-2xl grayscale hover:grayscale-0 transition-all duration-500 transform scale-120" 
                        />
                    </div>
                </div>
            </div>
        </section>
    );
};

        const StackSection = () => {
            const { t } = useLanguage();
            return (
                <section id="stack" className="py-24 px-6 bg-navy-900/30 z-10 relative">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16"><h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">~/</span> {t('stack.title')}</h2></div>
                        <TechTerminal />
                    </div>
                </section>
            );
        };

        const ExperienceSection = () => {
            const { t } = useLanguage();
            return (
                <section id="experience" className="py-24 px-6 z-10 relative">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16"><h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">{'['}</span> {t('exp.title')} <span className="text-ember-500">{']'}</span></h2></div>
                        <GamifiedTimeline />
                    </div>
                </section>
            );
        };

        const GallerySection = () => {
            const { t } = useLanguage();
            const [lightboxImg, setLightboxImg] = useState(null);

            return (
                <section id="rugs" className="py-24 px-6 bg-navy-900/30 z-10 relative">
                    <Lightbox src={lightboxImg?.src} title={lightboxImg?.title} onClose={() => setLightboxImg(null)} />
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">~</span> {t('gallery.title')} <span className="text-ember-500">~</span></h2>
                            <p className="text-white/60">{t('gallery.sub')}</p>
                        </div>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {RUG_GALLERY.map((rug) => (
                                <HolographicCard key={rug.id} className="aspect-[4/5]" onClick={() => setLightboxImg(rug)}>
                                    <div className="h-full w-full bg-navy-800 border-2 border-navy-700 overflow-hidden relative group">
                                        <img src={rug.src} alt={rug.title} className="w-full h-full object-cover" />
                                        <div className="absolute bottom-0 left-0 right-0 bg-navy-950/90 p-4 transform translate-y-full group-hover:translate-y-0 transition-transform duration-300 border-t-2 border-ember-500">
                                            <h3 className="text-ember-500 font-bold font-mono">{rug.title}</h3>
                                            <p className="text-white/70 text-xs">{rug.desc}</p>
                                        </div>
                                    </div>
                                </HolographicCard>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ContactSection = () => {
            const { t } = useLanguage();
            return (
                <section id="contact" className="py-24 px-6 z-10 relative">
                    <div className="max-w-4xl mx-auto">
                        <div className="text-center mb-12"><h2 className="text-4xl font-bold mb-4"><span className="text-ember-500">/*</span> {t('contact.title')} <span className="text-ember-500">*/</span></h2></div>
                        <div className="retro-card p-8 text-center">
                            <p className="text-white/70 mb-8">{t('contact.text')}</p>
                            <div className="flex flex-wrap justify-center gap-6">
                                <a href="mailto:wsandoval2@unab.edu.co" className="pixel-btn text-sm">wsandoval2@unab.edu.co</a>
                                <a href="https://www.linkedin.com/in/wsandoval2" target="_blank" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 hover:text-ember-500 transition-colors font-mono">LinkedIn</a>
                                <a href="https://instagram.com/billythekid.co" target="_blank" className="px-6 py-3 border-2 border-navy-700 text-white hover:border-ember-500 hover:text-ember-500 transition-colors font-mono">@billythekid.co</a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            const { t } = useLanguage();
            return (
                <footer className="py-12 px-6 border-t border-navy-800 bg-navy-950 z-10 relative">
                    <div className="max-w-6xl mx-auto text-center">
                        <p className="text-2xl font-mono text-ember-500 glow-ember mb-4">{t('footer.motto')}</p>
                        <p className="text-white/40 text-sm">© {new Date().getFullYear()} Serviam. {t('footer.rights')}.</p>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('en');
            const t = (key) => translations[lang][key] || key;
            return (
                <LanguageContext.Provider value={{ lang, setLang, t }}>
                    <div className="relative min-h-screen">
                        {/* Background Floating Pixels */}
                        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                            {Array.from({ length: 20 }).map((_, i) => (
                                <div key={i} className="absolute animate-float opacity-20" style={{ width: Math.random() * 8 + 4, height: Math.random() * 8 + 4, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`, backgroundColor: Math.random() > 0.5 ? '#F98125' : '#5B84C4', animationDelay: `${Math.random() * 5}s`, animationDuration: `${Math.random() * 10 + 10}s` }} />
                            ))}
                        </div>
                        <Navigation />
                        <main>
                            <HeroSection />
                            <AboutSection />
                            <StackSection />
                            <ExperienceSection />
                            <GallerySection />
                            <ContactSection />
                        </main>
                        <Footer />
                    </div>
                </LanguageContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
